<label for="password">密码</label>
<div class="password-field">
  <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="{{ password_autocomplete }}" required>
  <button type="button" class="password-toggle" aria-controls="password" aria-pressed="false" aria-label="显示密码" title="显示密码" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
      <circle cx="12" cy="12" r="3" />
      <path class="eye-slash" d="m4 4 16 16" />
    </svg>
  </button>
</div>
<script src="{{ url_for('static', filename='password-toggle.js') }}" defer></script>
