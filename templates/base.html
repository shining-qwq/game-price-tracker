<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}价格观察站{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="价格观察站首页">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span>价格观察站</span>
    </a>
    <nav class="header-nav" aria-label="主要导航">
      <a href="{{ url_for('notifications') }}">站内通知</a>
    </nav>
    <span class="demo-badge">来源：{{ source_label|default('模拟 / CheapShark 独立记录 · USD') }}</span>
  </header>
  <main>
    {% include '_game_navigation.html' %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
